<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Ательє "Stitch" - Зворотній зв’язок</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="logo-group">
            <img src="logo.jpg" alt="Логотип Ательє Stitch" class="header-logo">
            <h1>Ательє "Stitch"</h1>
        </div>

        <div>
            <a href="index.html">
                <button type="button">Головна</button>
            </a>
        </div>
    </header>

    <hr>

    <main class="feedback-main">
        <h2>Форма зворотнього зв’язку</h2>

        <form action="#" method="post" class="feedback-form">
            <fieldset class="form-fieldset">
                <legend class="form-legend">Персональна інформація</legend>
                
                <p class="form-row">
                    <label for="fullname"><strong>Прізвище та ім’я:</strong></label><br>
                    <input type="text" id="fullname" name="fullname" placeholder="Іванов Іван" required class="form-input">
                </p>

                <p class="form-row">
                    <label for="email"><strong>E-mail:</strong></label><br>
                    <input type="email" id="email" name="email" placeholder="example@mail.com" required class="form-input">
                </p>

                <p class="form-row">
                    <label for="age"><strong>Вік:</strong></label><br>
                    <input type="number" id="age" name="age" min="14" max="100" class="form-input">
                </p>
            </fieldset>

            <p>
                <label for="purpose"><strong>Мета звернення:</strong></label><br>
                <select id="purpose" name="purpose" required class="form-input">
                    <option value="cooperation">Співпраця</option>
                    <option value="complaint">Скарга на неякісний пошив</option>
                    <option value="proposal">Пропозиція</option>
                    <option value="bug">Наявність помилки</option>
                </select>
            </p>

            <p>
                <label for="details"><strong>Детально (макс. 500 символів):</strong></label><br>
                <textarea 
                    id="details" 
                    name="details" 
                    maxlength="500" 
                    placeholder="Введіть текст..." 
                    class="form-textarea"></textarea>
            </p>

            <p>
                <input type="checkbox" id="consent" name="consent" required>
                <label for="consent"><strong>Я даю згоду на обробку персональних даних</strong></label>
            </p>

            <p>
                <button type="submit" class="btn btn-submit">
                    Надіслати інформацію
                </button>
                <button type="reset" class="btn btn-reset">
                    Очистити
                </button>
            </p>
        </form>
    </main>

    <hr>

    <footer>
        <p>&copy; 2026 Ательє "Stitch". Усі права захищено.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
